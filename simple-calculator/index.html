<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 20px;
        }

        .calculator {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 24px;
            width: 100%;
            max-width: 320px;
        }

        .display {
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
        }

        .display .current {
            font-size: 2.5rem;
            font-weight: 300;
            min-height: 3rem;
            word-break: break-all;
        }

        .display .operation {
            font-size: 1rem;
            color: #888;
            min-height: 1.5rem;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            font-size: 1.5rem;
            padding: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-number {
            background: #f0f0f0;
            color: #333;
        }

        .btn-number:hover {
            background: #e0e0e0;
        }

        .btn-operator {
            background: #ff9500;
            color: #fff;
        }

        .btn-operator:hover {
            background: #e08600;
        }

        .btn-equals {
            background: #ff9500;
            color: #fff;
            grid-column: span 2;
        }

        .btn-equals:hover {
            background: #e08600;
        }

        .btn-clear {
            background: #ff3b30;
            color: #fff;
        }

        .btn-clear:hover {
            background: #e03228;
        }

        .btn-decimal {
            background: #f0f0f0;
            color: #333;
        }

        .btn-decimal:hover {
            background: #e0e0e0;
        }

        .btn-empty {
            background: transparent;
            pointer-events: none;
        }

        @media (max-width: 400px) {
            .calculator {
                padding: 16px;
                max-width: 100%;
            }

            button {
                padding: 14px;
                font-size: 1.25rem;
            }

            .display .current {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="operation" id="operation"></div>
            <div class="current" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-operator" onclick="setOperator('/')">÷</button>
            <button class="btn-operator" onclick="setOperator('*')">×</button>
            <button class="btn-operator" onclick="setOperator('-')">−</button>
            
            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="setOperator('+')">+</button>
            
            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-empty"></button>
            
            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-equals" onclick="calculate()">=</button>
            
            <button class="btn-number" onclick="appendNumber('0')">0</button>
            <button class="btn-decimal" onclick="appendDecimal()">.</button>
            <button class="btn-empty"></button>
            <button class="btn-empty"></button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let currentOperator = '';
        let shouldResetDisplay = false;

        const displayEl = document.getElementById('display');
        const operationEl = document.getElementById('operation');

        function updateDisplay() {
            let displayValue = currentInput;
            
            // Handle very long numbers
            if (displayValue.length > 15) {
                displayValue = parseFloat(displayValue).toExponential(10);
            }
            
            displayEl.textContent = displayValue;
        }

        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentInput = '';
                shouldResetDisplay = false;
            }
            
            if (currentInput === '0' && num !== '0') {
                currentInput = num;
            } else if (currentInput === '0' && num === '0') {
                // Keep as is
            } else if (currentInput.length < 15) {
                currentInput += num;
            }
            
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetDisplay) {
                currentInput = '0';
                shouldResetDisplay = false;
            }
            
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            
            updateDisplay();
        }

        function setOperator(op) {
            if (previousInput !== '' && currentOperator !== '' && !shouldResetDisplay) {
                calculate();
            }
            
            previousInput = currentInput;
            currentOperator = op;
            shouldResetDisplay = true;
            
            const operatorSymbol = op === '+' ? '+' : op === '-' ? '−' : op === '*' ? '×' : op === '/' ? '÷' : op;
            operationEl.textContent = `${previousInput} ${operatorSymbol}`;
        }

        function calculate() {
            if (currentOperator === '' || previousInput === '') {
                return;
            }
            
            let result;
            const prev = parseFloat(previousInput);
            const curr = parseFloat(currentInput);
            
            switch (currentOperator) {
                case '+':
                    result = prev + curr;
                    break;
                case '-':
                    result = prev - curr;
                    break;
                case '*':
                    result = prev * curr;
                    break;
                case '/':
                    if (curr === 0) {
                        displayEl.textContent = 'Error';
                        operationEl.textContent = '';
                        currentInput = '0';
                        previousInput = '';
                        currentOperator = '';
                        shouldResetDisplay = false;
                        return;
                    }
                    result = prev / curr;
                    break;
                default:
                    return;
            }
            
            // Handle decimal precision
            if (!Number.isInteger(result)) {
                result = parseFloat(result.toFixed(10));
                // Remove trailing zeros
                result = parseFloat(result);
            }
            
            currentInput = result.toString();
            operationEl.textContent = '';
            previousInput = '';
            currentOperator = '';
            shouldResetDisplay = true;
            
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            currentOperator = '';
            shouldResetDisplay = false;
            operationEl.textContent = '';
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === '.') {
                appendDecimal();
            } else if (e.key === '+') {
                setOperator('+');
            } else if (e.key === '-') {
                setOperator('-');
            } else if (e.key === '*') {
                setOperator('*');
            } else if (e.key === '/') {
                setOperator('/');
            } else if (e.key === 'Enter' || e.key === '=') {
                calculate();
            } else if (e.key === 'Escape') {
                clearDisplay();
            } else if (e.key === 'Backspace') {
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = '0';
                }
                updateDisplay();
            }
        });
    </script>
</body>
</html>
